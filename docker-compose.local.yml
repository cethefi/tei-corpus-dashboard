#   podman-compose -f docker-compose.yml -f docker-compose.local.yml build
#   podman-compose -f docker-compose.yml -f docker-compose.local.yml up -d

version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - HTTPS_PROXY=
      - HTTP_PROXY=
      - NO_PROXY=

  leafwriter:
    build:
      context: ./leafwriter
      dockerfile: Dockerfile
      args:
        - ROUTER_BASE=/
    environment:
      # - AUTH_API_URL=http://backend:8091
      - KEYCLOAK_URL=

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "9000:80"
    depends_on:
      - backend
      - leafwriter
    restart: unless-stopped
